<div id="stage">

    <circle r="96" fill="#3A404E" stroke="#8C9BB5" stroke-width="2"/>

    <circle r="84" fill="#0A1228"/>
    <!-- Concentric Snailing & Chapter Ring -->
    <circle r="72" fill="none" stroke="#25355A" stroke-width="1.5"/>
    <circle r="68" fill="#070D1E"/>
    <!-- 12 Champagne Gold Applied Hour Markers -->
    <circle r="72" fill="none" stroke="#D9C08A" stroke-width="5" stroke-dasharray="2.5 35.2" stroke-dashoffset="1.25" transform="rotate(-90)"/>

    <circle cx="-32" cy="30" r="14" fill="none" stroke="#E5A044" stroke-width="2"/>
    <circle cx="-32" cy="30" r="4" fill="#991428"/>
    <!-- Moonphase Aperture at 6 o'clock -->
    <circle cx="0" cy="56" r="15" fill="#03060E" stroke="#D9C08A" stroke-width="2"/>
    <circle cx="0" cy="56" r="12.5" fill="#0A1228"/>
    <circle cx="-2.5" cy="54" r="5" fill="#E8D2A2"/>
    <circle cx="-0.8" cy="53.2" r="5" fill="#0A1228"/>
    <circle cx="4" cy="60" r="1" fill="#D9C08A"/>
    <circle cx="6" cy="52" r=".8" fill="#D9C08A"/>
    <circle cx="-5" cy="61" r=".8" fill="#D9C08A"/>
    <!-- Date Window at 3 o'clock -->
    <rect x="52" y="-9" width="18" height="18" rx="2" fill="#F2F5FC" stroke="#D9C08A" stroke-width="2"/>
    <text x="61" y="4" font-family="monospace" font-size="10" font-weight="bold" fill="#0A1020" text-anchor="middle">28</text>
    <!-- Hands -->

    <g id="sm"><line y2="-64" stroke="#E8D2A2" stroke-width="3" stroke-linecap="round"/></g>

    <circle r="4" fill="#E8C9A6"/>
